name: Run TohidYUKIMUSICS

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read
  actions: write

concurrency:
  group: tohid-yuki-bot
  cancel-in-progress: true

jobs:
  run-bot:
    runs-on: ubuntu-22.04
    timeout-minutes: 355
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements.txt
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg build-essential libffi-dev libssl-dev
          curl -fsSL https://deno.land/install.sh | sh
          echo "$HOME/.deno/bin" >> "$GITHUB_PATH"
          "$HOME/.deno/bin/deno" --version
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -r requirements.txt
          python -m pip install --upgrade "yt-dlp[default]"
          python - <<'PY'
          import yt_dlp
          print("yt-dlp:", yt_dlp.version.__version__)
          import yt_dlp_ejs
          print("yt-dlp-ejs: available")
          PY
      - name: Validate required secrets
        env:
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          MONGO_DB_URI: ${{ secrets.MONGO_DB_URI }}
          STRING_SESSION: ${{ secrets.STRING_SESSION }}
        run: |
          set -euo pipefail
          for name in API_ID API_HASH BOT_TOKEN MONGO_DB_URI STRING_SESSION; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Missing required secret: $name"
              exit 1
            fi
          done
      - name: Start bot
        env:
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          MONGO_DB_URI: ${{ secrets.MONGO_DB_URI }}
          OWNER_ID: ${{ secrets.OWNER_ID }}
          OWNER_USERNAME: ${{ secrets.OWNER_USERNAME }}
          BOT_USERNAME: ${{ secrets.BOT_USERNAME }}
          BOT_NAME: ${{ secrets.BOT_NAME }}
          ASSUSERNAME: ${{ secrets.ASSUSERNAME }}
          LOGGER_ID: ${{ secrets.LOGGER_ID }}
          STRING_SESSION: ${{ secrets.STRING_SESSION }}
          LICENSE_KEY: ${{ secrets.LICENSE_KEY }}
          STRING_SESSION2: ${{ secrets.STRING_SESSION2 }}
          STRING_SESSION3: ${{ secrets.STRING_SESSION3 }}
          STRING_SESSION4: ${{ secrets.STRING_SESSION4 }}
          STRING_SESSION5: ${{ secrets.STRING_SESSION5 }}
          STRING_SESSION6: ${{ secrets.STRING_SESSION6 }}
          STRING_SESSION7: ${{ secrets.STRING_SESSION7 }}
          SUPPORT_CHANNEL: ${{ secrets.SUPPORT_CHANNEL }}
          SUPPORT_CHAT: ${{ secrets.SUPPORT_CHAT }}
          DURATION_LIMIT: ${{ secrets.DURATION_LIMIT }}
          START_IMG_URL: ${{ secrets.START_IMG_URL }}
          PING_IMG_URL: ${{ secrets.PING_IMG_URL }}
          WEBSITE_URL: ${{ secrets.WEBSITE_URL }}
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          NSFWAPI: ${{ secrets.NSFWAPI }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${LICENSE_KEY:-}" ]]; then
            echo "::error::Missing required secret: LICENSE_KEY"
            exit 1
          fi
          printf 'LICENSE_KEY=%s\n' "$LICENSE_KEY" > .env

          # Keep the bot detached, but write its complete stdout/stderr to a file.
          # The foreground monitor step below tails this file into the Actions log.
          : > "$RUNNER_TEMP/yuki-music.log"
          nohup python -u -m YUKIIMUSIC > "$RUNNER_TEMP/yuki-music.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/yuki-music.pid"
          echo "YUKIIMUSICS started with bot PID $(cat "$RUNNER_TEMP/yuki-music.pid")"

      - name: Verify bot ready
        id: ready
        env:
          PID_FILE: ${{ runner.temp }}/yuki-music.pid
        shell: bash
        run: |
          set -euo pipefail
          for i in {1..120}; do
            if [[ -f "$PID_FILE" ]]; then
              pid="$(cat "$PID_FILE")"
              if ! kill -0 "$pid" 2>/dev/null; then
                echo "::error::YUKIIMUSICS exited during startup."
                echo "===== LAST 200 BOT LOG LINES ====="
                tail -n 200 "$RUNNER_TEMP/yuki-music.log" || true
                exit 1
              fi
              if (( i >= 30 )); then
                echo "YUKIIMUSICS process is alive after startup wait (monitor PID $pid)."
                exit 0
              fi
            fi
            sleep 1
          done
          echo "::error::YUKIIMUSICS did not become ready."
          echo "===== LAST 200 BOT LOG LINES ====="
          tail -n 200 "$RUNNER_TEMP/yuki-music.log" || true
          exit 1

      - name: Monitor and schedule successor
        env:
          GH_TOKEN: ${{ github.token }}
          PID_FILE: ${{ runner.temp }}/yuki-music.pid
        shell: bash
        run: |
          set -euo pipefail
          # GitHub Actions may not reliably stream output from a detached
          # background process. Tail the bot log from this foreground step so
          # every print, traceback, and runtime activity is visible in Actions.
          touch "$RUNNER_TEMP/yuki-music.log"
          tail -n 0 -F "$RUNNER_TEMP/yuki-music.log" &
          tail_pid=$!
          trap 'kill "$tail_pid" 2>/dev/null || true' EXIT

          started="$(date +%s)"
          dispatched=false
          while true; do
            pid="$(cat "$PID_FILE")"
            if ! kill -0 "$pid" 2>/dev/null; then
              echo "::error::YUKIIMUSICS process stopped."
              echo "===== LAST 200 BOT LOG LINES ====="
              tail -n 200 "$RUNNER_TEMP/yuki-music.log" || true
              exit 1
            fi
            age=$(( $(date +%s) - started ))
            if (( age >= 20100 && dispatched == false )); then
              echo "Starting successor runner before the 6-hour limit..."
              gh workflow run run-yuki.yml --repo "$GITHUB_REPOSITORY" --ref main
              dispatched=true
            fi
            sleep 30
          done
